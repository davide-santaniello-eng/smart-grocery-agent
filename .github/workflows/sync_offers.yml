name: Grocery Flyer & Price Sync

on:
  schedule:
    # Run every Thursday at 05:00 UTC (when weekly supermarket flyers are published)
    - cron: '0 5 * * 4'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync-offers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Synchronize Supermarket Offers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://shiakflrglavejigokig.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_qEztE42l6elMhPbon6oVuA_1FxH2qh4' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -m backend.app.ingestion.sync --dry-run
